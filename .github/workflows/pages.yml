# Build the site with Hugo, test the playground in headless Chrome, and
# publish it to GitHub Pages (xolang.dev). A failing test stops the deploy.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: v0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the whole history: enableGitInfo dates each page by its last commit
          fetch-depth: 0
      - name: Check the release facts
        run: scripts/check-facts.sh
      - uses: actions/setup-go@v7
        with:
          # Hugo v0.167.0 needs go 1.27; setup-go v7 sets GOTOOLCHAIN=local, so
          # the version must be the one Hugo requires (v5 let go download it)
          go-version: "1.27"
          # no go.sum here: Hugo is installed with go install, nothing to cache
          cache: false
      - name: Install Hugo
        run: CGO_ENABLED=0 GOBIN="$PWD/.tools/bin" go install "github.com/gohugoio/hugo@${HUGO_VERSION}"
      - name: Build
        run: .tools/bin/hugo --gc --minify
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test the playground
        timeout-minutes: 10
        env:
          CHROME: /usr/bin/google-chrome
          CHROME_FLAGS: --no-sandbox
        run: node scripts/test-playground.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
