<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="CPU microseconds a request of the /alloc server as its fiber stack is shifted: 35.6 to 35.8 at most offsets, 40.7 to 48.4 at five of the twelve tested, the shipped build (offset 0) on the slowest">
<style>:root{--bg:#ffffff;--fg:#1f2328;--mut:#57606a;--grid:#eef0f3;--ok:#8b95a1;--bad:#c62828;--line:#57606a}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9aa4af;--grid:#1b222c;--ok:#6b7785;--bad:#ff6b6b;--line:#9aa4af}}text{font:13px system-ui,-apple-system,sans-serif;fill:var(--fg)}.m{fill:var(--mut);font-size:12px}.t{font-weight:600;font-size:14px}.v{font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px}.g{stroke:var(--grid);stroke-width:1}.l{stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}</style>
<rect width="780" height="400" fill="var(--bg)"/>
<text class="t" x="24" y="28">The same server, 12 stack offsets: five cost 14% to 36% more CPU a request</text>
