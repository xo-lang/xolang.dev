<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-label="/alloc speed of v0.35.0's own code built at four function layouts, and of main, as a percentage of the v0.35.0 binary that shipped: the same code spans 96.6% to 101.1%, and main sits inside that span">
<style>:root{--bg:#ffffff;--fg:#1f2328;--mut:#57606a;--grid:#eef0f3;--band:#dbe4f0;--a:#1d4ed8;--b:#b45309;--line:#57606a}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9aa4af;--grid:#1b222c;--band:#26334a;--a:#79b8ff;--b:#f2b84b;--line:#9aa4af}}text{font:13px system-ui,-apple-system,sans-serif;fill:var(--fg)}.m{fill:var(--mut);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:4px}.t{font-weight:600;font-size:14px}.g{stroke:var(--grid);stroke-width:1}.l{stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}</style>
<rect width="780" height="440" fill="var(--bg)"/>
<text class="t" x="24" y="30">Same code, different function placement: up to 4.5% apart</text>
<text class="m" x="24" y="50">/alloc requests a second, as a percentage of the v0.35.0 binary that shipped (higher is faster)</text>
<line class="g" x1="250.0" x2="250.0" y1="74" y2="328"/>
<text class="m" x="250.0" y="346" text-anchor="middle">90%</text>
<line class="g" x1="326.7" x2="326.7" y1="74" y2="328"/>
<text class="m" x="326.7" y="346" text-anchor="middle">92.5%</text>
<line class="g" x1="403.3" x2="403.3" y1="74" y2="328"/>
<text class="m" x="403.3" y="346" text-anchor="middle">95%</text>
<line class="g" x1="480.0" x2="480.0" y1="74" y2="328"/>
<text class="m" x="480.0" y="346" text-anchor="middle">97.5%</text>
<line class="g" x1="556.7" x2="556.7" y1="74" y2="328"/>
<text class="m" x="556.7" y="346" text-anchor="middle">100%</text>
<line class="g" x1="633.3" x2="633.3" y1="74" y2="328"/>
<text class="m" x="633.3" y="346" text-anchor="middle">102.5%</text>
<line class="g" x1="710.0" x2="710.0" y1="74" y2="328"/>
<text class="m" x="710.0" y="346" text-anchor="middle">105%</text>
<line class="l" x1="556.7" x2="556.7" y1="74" y2="328"/>
<text x="236" y="114" text-anchor="end" class="t">v0.35.0's own code,</text><text class="m" x="236" y="132" text-anchor="end">built at 4 layouts</text>
<text x="236" y="254" text-anchor="end" class="t">main (0.37 development),</text><text class="m" x="236" y="272" text-anchor="end">built at 1 layout</text>
<rect x="476.9" y="97" width="88.9" height="18" rx="9" fill="var(--band)"/>
<circle cx="565.9" cy="106" r="6" fill="var(--a)"/>
<circle cx="489.2" cy="106" r="6" fill="var(--a)"/>
<circle cx="476.9" cy="106" r="6" fill="var(--a)"/>
<circle cx="486.1" cy="106" r="6" fill="var(--a)"/>
<circle cx="556.7" cy="106" r="5" fill="none" stroke="var(--a)" stroke-width="2"/>
<text class="m" x="464.9" y="110" text-anchor="end">97.4%</text><text class="m" x="577.9" y="110">100.3%</text>
<circle cx="480.0" cy="246" r="6" fill="var(--a)"/><text class="m" x="468.0" y="250" text-anchor="end">97.5%</text>
<rect x="452.4" y="131" width="138.0" height="18" rx="9" fill="var(--band)"/>
<circle cx="590.4" cy="140" r="6" fill="var(--b)"/>
<circle cx="492.3" cy="140" r="6" fill="var(--b)"/>
<circle cx="452.4" cy="140" r="6" fill="var(--b)"/>
<circle cx="486.1" cy="140" r="6" fill="var(--b)"/>
<circle cx="568.9" cy="140" r="5" fill="none" stroke="var(--b)" stroke-width="2"/>
<text class="m" x="440.4" y="144" text-anchor="end">96.6%</text><text class="m" x="602.4" y="144">101.1%</text>
<circle cx="467.7" cy="280" r="6" fill="var(--b)"/><text class="m" x="455.7" y="284" text-anchor="end">97.1%</text>
<text class="m" x="556.7" y="68" text-anchor="middle">100% = the shipped v0.35.0 binary</text>
<text class="m" x="710" y="172" text-anchor="end">layout 0 = the layout that shipped (it matches the release)</text>
<text class="m" x="250" y="362">Row 1: one dot per layout of the same source (nops before every function shift it).</text>
<text class="m" x="250" y="380">The ring is layout 0 built a second time: build noise is under 1%.</text>
<text class="m" x="250" y="396">Main lands inside the span v0.35.0 itself covers, so the gap to the release is placement, not code.</text>
<circle cx="256" cy="422" r="5" fill="var(--a)"/><text class="m" x="266" y="426">32 connections</text><circle cx="400" cy="422" r="5" fill="var(--b)"/><text class="m" x="410" y="426">256 connections</text>
</svg>