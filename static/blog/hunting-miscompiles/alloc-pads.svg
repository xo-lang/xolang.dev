<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="/alloc throughput of v0.35.0 built at four code placements, and of main, as a ratio to the v0.35.0 release server">
<style>:root{--fg:#1f2328;--mut:#6b7280;--grid:#e5e7eb;--a:#2563eb;--b:#d97706}@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--mut:#9ca3af;--grid:#30363d;--a:#60a5fa;--b:#fbbf24}}text{font:13px system-ui,sans-serif;fill:var(--fg)}.m{fill:var(--mut);font-size:12px}.g{stroke:var(--grid);stroke-width:1}.r{stroke:var(--mut);stroke-width:1.5;stroke-dasharray:4 3}</style>
<text x="150" y="22" style="font-weight:600">/alloc requests a second, ratio to the v0.35.0 release server (higher is faster)</text>
<line class="g" x1="185.8" x2="185.8" y1="40" y2="278"/><text class="m" x="185.8" y="296" text-anchor="middle">0.96</text>
<line class="g" x1="257.5" x2="257.5" y1="40" y2="278"/><text class="m" x="257.5" y="296" text-anchor="middle">0.97</text>
<line class="g" x1="329.2" x2="329.2" y1="40" y2="278"/><text class="m" x="329.2" y="296" text-anchor="middle">0.98</text>
<line class="g" x1="400.9" x2="400.9" y1="40" y2="278"/><text class="m" x="400.9" y="296" text-anchor="middle">0.99</text>
<line class="r" x1="472.6" x2="472.6" y1="40" y2="278"/><text class="m" x="472.6" y="296" text-anchor="middle">1.00</text>
<line class="g" x1="544.3" x2="544.3" y1="40" y2="278"/><text class="m" x="544.3" y="296" text-anchor="middle">1.01</text>
<line class="g" x1="616.0" x2="616.0" y1="40" y2="278"/><text class="m" x="616.0" y="296" text-anchor="middle">1.02</text>
<text x="140" y="66" text-anchor="end">v0.35.0 release</text>
<line class="g" x1="150" x2="616" y1="62" y2="62" opacity=".5"/>
<circle cx="472.6" cy="57" r="6" fill="var(--a)"/><circle cx="472.6" cy="67" r="6" fill="var(--b)"/>
<text x="140" y="100" text-anchor="end">pad 0</text>
<line class="g" x1="150" x2="616" y1="96" y2="96" opacity=".5"/>
<circle cx="494.1" cy="91" r="6" fill="var(--a)"/><circle cx="551.5" cy="101" r="6" fill="var(--b)"/>
<text x="140" y="134" text-anchor="end">pad 0 again</text>
<line class="g" x1="150" x2="616" y1="130" y2="130" opacity=".5"/>
<circle cx="472.6" cy="125" r="6" fill="var(--a)"/><circle cx="501.3" cy="135" r="6" fill="var(--b)"/>
<text x="140" y="168" text-anchor="end">pad 1</text>
<line class="g" x1="150" x2="616" y1="164" y2="164" opacity=".5"/>
<circle cx="314.9" cy="159" r="6" fill="var(--a)"/><circle cx="322.1" cy="169" r="6" fill="var(--b)"/>
<text x="140" y="202" text-anchor="end">pad 2</text>
<line class="g" x1="150" x2="616" y1="198" y2="198" opacity=".5"/>
<circle cx="286.2" cy="193" r="6" fill="var(--a)"/><circle cx="228.9" cy="203" r="6" fill="var(--b)"/>
<text x="140" y="236" text-anchor="end">pad 3</text>
<line class="g" x1="150" x2="616" y1="232" y2="232" opacity=".5"/>
<circle cx="307.7" cy="227" r="6" fill="var(--a)"/><circle cx="307.7" cy="237" r="6" fill="var(--b)"/>
<text x="140" y="270" text-anchor="end">main, pad 0</text>
<line class="g" x1="150" x2="616" y1="266" y2="266" opacity=".5"/>
<circle cx="293.4" cy="261" r="6" fill="var(--a)"/><circle cx="264.7" cy="271" r="6" fill="var(--b)"/>
<circle cx="150" cy="316" r="5" fill="var(--a)"/><text x="160" y="320">32 connections</text><circle cx="280" cy="316" r="5" fill="var(--b)"/><text x="290" y="320">256 connections</text>
</svg>