{{- /* Usage: {{< level "Solid" >}} or {{< level "Solid" "https://evidence" >}}: a maturity pill (Early, Solid, Proven). The word is in the pill; colour only adds to it. */ -}}
{{- $l := .Get 0 -}}{{- $u := .Get 1 -}}
{{- if $u }}<a class="level level-{{ lower $l }}" href="{{ $u }}">{{ $l }}</a>{{ else }}<span class="level level-{{ lower $l }}">{{ $l }}</span>{{ end -}}
