baseURL = "https://xolang.dev/"
locale = "en-US"
title = "Xo Language"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
description = "Xo is a small, statically typed language for backends, tools, and web services, built for AI agents to write, check, and debug."
github = "https://github.com/xo-lang"
# The compiler's source repo (public since 2026-10-18). With sourcePublic
# false, pages say it is coming and hide links into it.
sourceRepo = "https://github.com/xo-lang/xo"
sourcePublic = true
version = "v0.23"

# The orange bar at the top of every page. Set enabled = false to hide it.
[params.announcement]
enabled = true
html = "<b>Xo is experimental.</b> The source is now public on <a href=\"https://github.com/xo-lang/xo\">GitHub</a>, or <a href=\"/play/\">try Xo in your browser</a>."

[menus]
[[menus.main]]
name = "docs"
pageRef = "/docs"
weight = 10
[[menus.main]]
name = "tour"
pageRef = "/docs/tour"
weight = 15
[[menus.main]]
name = "spec"
pageRef = "/docs/spec"
weight = 20
[menus.main.params]
wide = true
[[menus.main]]
name = "blog"
pageRef = "/blog"
weight = 30
[[menus.main]]
name = "releases"
pageRef = "/releases"
weight = 35

# llms.txt on the home page, and the raw Markdown of every page next to its
# HTML (/docs/spec/core/index.md), for agents.
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true

[mediaTypes."text/markdown"]
suffixes = ["md"]

[outputs]
home = ["html", "rss", "llms"]
page = ["html", "markdown"]
section = ["html", "rss", "markdown"]

[markup.goldmark.renderer]
unsafe = false

[markup.goldmark.parser.attribute]
block = true

[markup.highlight]
noClasses = false
guessSyntax = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3
