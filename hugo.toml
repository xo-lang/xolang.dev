baseURL = "https://xolang.dev/"
locale = "en-US"
title = "Xo Language"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
description = "Xo is a small, statically typed language for backends and web services, built for AI agents to write, check, and debug."
github = "https://github.com/xo-lang"
version = "v0.9"

# The orange bar at the top of every page. Set enabled = false to hide it.
[params.announcement]
enabled = true
html = "<b>Xo is experimental.</b> v0.9 is out; expect breaking changes before 1.0. <a href=\"/blog/\">Read the release notes</a>"

[menus]
[[menus.main]]
name = "docs"
pageRef = "/docs"
weight = 10
[[menus.main]]
name = "spec"
pageRef = "/docs/spec"
weight = 20
[[menus.main]]
name = "blog"
pageRef = "/blog"
weight = 30
[[menus.main]]
name = "github"
url = "https://github.com/xo-lang"
weight = 40

# llms.txt on the home page, and the raw Markdown of every page next to its
# HTML (/docs/spec/core/index.md), for agents.
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true

[mediaTypes."text/markdown"]
suffixes = ["md"]

[outputs]
home = ["html", "rss", "llms"]
page = ["html", "markdown"]
section = ["html", "rss"]

[markup.goldmark.renderer]
unsafe = false

[markup.goldmark.parser.attribute]
block = true

[markup.highlight]
noClasses = false
guessSyntax = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3
