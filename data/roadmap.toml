# The road to 1.0 and the self-hosting plan. The home page summary and
# /roadmap/ both read this. status: done, now, or next. text is HTML.

[[milestones]]
title = "Language design and specification"
status = "done"
text = "Syntax, types, effects, and diagnostics written down as a spec, with every design choice recorded as a numbered decision."

[[milestones]]
title = "A compiler that emits Go"
status = "done"
text = "The type, effect, and concurrency checker, and the Go backend: every program builds into static binaries for linux, darwin, windows, and wasi."

[[milestones]]
title = "Tools for agents"
status = "done"
text = "JSON diagnostics with fixes, semantic queries and edits, a language server, concurrency tests that search task interleavings, and record and replay."

[[milestones]]
title = "Modules"
status = "done"
text = "Lock files, module proxies, a checksum log, and per definition hashes that show what a release really changed."

[[milestones]]
title = "Native backends, in preview"
status = "done"
text = "LLVM and a direct arm64 backend build programs to native code with no garbage collector (<code>--no-gc</code>)."

[[milestones]]
title = "Real-time functions"
status = "done"
text = "<code>uses realtime</code>: the compiler enforces bounded loops, no recursion, and no allocation."

[[milestones]]
title = "A front end written in Xo"
status = "done"
text = "The lexer, parser, and type checker rewritten in Xo, with output identical to the Go implementation on every program in the repository, on all three backends."

[[milestones]]
title = "A playground in the browser"
status = "done"
text = "The compiler and the Go toolchain run in WebAssembly, so <a href=\"/play/\">the playground</a> needs no server."

[[milestones]]
title = "The rest of the compiler in Xo"
status = "now"
text = "Every part of the Xo compiler now exists in Xo: lexer, parser, checker, SSA, and all three code generators, and Xo compiles itself. The self-hosted checker agrees with the Go checker on all 685 repository runs. Next: retiring the Go implementation."

[[milestones]]
title = "Stability audit"
status = "next"
text = "Last pass 2026-10-11: 207 of 219 spec features stable, 1 in preview, and 11 gaps, all marked for later. The project owner decides which gaps close before 1.0."

[[milestones]]
title = "1.0"
status = "next"
text = "Code that builds keeps building. The Go backend is the supported path at 1.0; the native backends ship as preview."

[[milestones]]
title = "Native backends out of preview"
status = "next"
text = "After 1.0: LLVM and arm64 build the whole language without a garbage collector, with the same guarantees as the Go backend."

[[milestones]]
title = "A bigger standard library"
status = "next"
text = "More of what real programs need. Command line tools came first and are done (see the plan below)."

[[plan]]
title = "Front end in Xo"
status = "done"
text = "The lexer, parser, and type checker give output identical to the Go compiler on all three backends: 610 of 626 repository programs (the other 16 call Go or C)."

[[plan]]
title = "SSA builder in Xo"
status = "done"
text = "All 8 stages. 11,543 of 11,569 functions identical to the Go builder's SSA, and 6,282 of 6,376 in test binaries; every function left over is one the Go builder rejects too. The passes give identical output on all 306 programs both build completely, and the verifier's 32,411 mutant verdicts (one per function with a retain or release removed) match. No differences on any backend. Built with LLVM, a full run through every pass and the verifier takes 1.05x the time of the Go-built compiler (1.3x with the Go or arm64 backend); the build step alone, 1.6x to 2.3x."

[[plan]]
title = "Supply-chain safety by default"
status = "done"
text = "Only your own module vouches for a dependency's C bindings, <code>xo.lock</code> locks each dependency's effects, capabilities can be narrowed at run time, <code>xo audit</code> reports it all, and logging is an effect. Against 15 attack scenarios from the Backstabber's Knife Collection: 10 blocked."

[[plan]]
title = "Prebuilt runtime"
status = "done"
text = "Release builds ship the arm64 backend's C runtime prebuilt for each target, so arm64 builds no longer compile C: no clang needed. The system C toolchain (<code>cc</code>) still assembles and links the output; the LLVM backend still compiles its IR with clang. A first build on a cold cache went from 1.94 s to 0.13 s for a small program and from 4.27 s to 0.28 s for an HTTPS server (darwin/arm64). The linux/arm64 runtime is cross compiled on a Mac and reproducible byte for byte."

[[plan]]
title = "arm64 emitter in Xo, and the fixed point"
status = "done"
text = "Xo compiles itself, on arm64 Macs so far. The compiler written entirely in Xo, built by the Go compiler, compiles itself, and that build compiles it again; the assembly of both builds is byte identical to the Go compiler's (8.9 million lines). The emitter matches the Go emitter on all 10,975 functions of the repository. The self-compiled compiler passes 132 of 138 arm64 tests; the other 6 need TLS, which is being added. The released <code>xo</code> does not use it yet; switching is the owner's decision."

[[plan]]
title = "Standard library for tools"
status = "done"
text = "Typed command line flags and subcommands with generated help and shell completions (<code>std/cli</code>), running other programs with pipelines, terminals and colors, file handles, globs, and locks, CSV, TOML, regular expressions, and archives, and <code>xo build --stamp</code> for version stamping. All of it now builds on the native backends too, with output identical to the Go backend."

[[plan]]
title = "LLVM emitter in Xo"
status = "done"
text = "13,683 of 13,683 functions identical to the Go emitter's, and 318 of 318 modules byte identical. End to end, the Xo pipeline lowered the SSA builder to 398 MB of LLVM IR byte identical to the Go emitter's, and the binary clang built from it gives the same output. The Xo emitter takes about half the Go emitter's time."

[[plan]]
title = "Assembler and linker in Xo"
status = "done"
text = "On arm64 Macs the self-hosted compiler now assembles and links its own executables, with no C toolchain. Its objects for all 158 arm64 test programs and for the compiler itself are byte identical to the system assembler's (the compiler's own in 4.92 s against 35.40 s). With no C compiler, assembler, or linker on the <code>PATH</code>, the compiler links itself to a fixed point and passes 158 of 158 tests. Since then also linux/arm64: objects byte identical to clang's, and all 159 test programs linked by it pass on glibc 2.31 and 2.41 with no C toolchain installed. Opt-in with <code>--ld=macho</code> for now."

[[plan]]
title = "Go code generator in Xo"
status = "done"
text = "467 of 467 compared runs generate byte identical Go (all 27,864 declarations), and the Xo compiler builds itself with <code>--backend=go</code> to a fixed point. That backend keeps using the Go toolchain for your programs, <code>use go</code>, and Go's targets."

[[plan]]
title = "Retire the Go implementation"
status = "now"
text = "In progress. Native builds now go through the compiler written in Xo: <code>xo build</code>, <code>run</code>, and <code>test</code> with <code>--backend=arm64</code> or <code>llvm</code> run the self-hosted driver, which <code>xo</code> builds from its own embedded Xo sources. Its 159 arm64 test binaries are byte identical to the Go driver's, and the fixed point holds; <code>XO_SELF_DRIVER=0</code> switches back. Every other command group now exists in Xo too, checked against the Go version: the core tools (the formatter is byte identical on all 1,121 repository files), the semantic tools (definition hashes identical on 270 of 270 modules), the module commands (41 of 41 steps byte identical), the MCP, LSP, and build servers (every compared response identical), and <code>xo bind --c</code> (17 of 17 cases identical; binding Go packages runs a small Go helper). <code>xo</code> itself becomes the self-hosted binary, approved by the project owner, once the remaining gaps close and the full command line test suite passes against it; that gate is being worked now. After that, each change is made once instead of twice."

[[plan]]
title = "WebAssembly backend"
status = "now"
text = "In progress, written only in Xo. The backend turns SSA into WebAssembly text, assembles it with an assembler written in Xo, and runs over WASI with its own runtime. Of 143 test programs, 121 give the expected output with no leaks, 22 stop at build time with a clear &quot;the wasm backend does not support ...&quot; error, and none run with wrong output. Tasks and channels run on a cooperative scheduler on one thread. Toward the compiler in the browser: the self-hosted checker, compiled to WebAssembly, prints exactly what the Go backend build of it prints (3,398 lines on seven programs). Passing large values by reference and tighter liveness shrank its module from 43 MB to 8.9 MB, and its run under Node from 10.73 s and 5.94 GB to 1.93 s and 2.50 GB (the native build: 0.06 s). In headless Chrome it checks a small program in 446 ms, but deeply nested expressions still overflow the browser's worker stack, so smaller frames are next, then the rest of the compiler, so the playground needs no Go compiler or linker to download."

[[plan]]
title = "Runtime pilot, then the runtime port"
status = "now"
text = "In progress. The pilot is done: the native runtime's Unicode operations are written in Xo, with output identical on every backend and runtime objects 4.7 percent smaller. The bar for porting more of the runtime is every workload within 5 percent of the C version, in instructions, on both native backends. Both now meet it on the Unicode workloads: arm64 after its inliner learned to inline small functions that call others and to drop checks it can prove safe, LLVM after it learned the same value ranges and inlining (the case-insensitive compare went from 1.13 to 0.95 times the C). So the port continues, one step at a time, each behind a selectable C version. Steps 1 and 2 are done: Int.parse, Duration.parse, a Time's RFC 3339 text and JSON parse, Debug quoting, Str.replace, and the trims are now Xo, and on these workloads the ported code matches or beats the C it replaced (Int.parse about 0.7 times the C's instructions, Time text about 0.2 times, since the old C used <code>snprintf</code>). A Duration's text misses the bar and stays C for now: the arm64 backends now turn division by a constant into a multiply, which was the suspected cause, but that trades one divide for several cheaper instructions, so the count barely moved (1.17 times the C on arm64, 1.09 times on LLVM). Bulk byte scans (split, lines, rune counts) stay C by design."

[[plan]]
title = "Supply-chain follow-ups"
status = "done"
text = "Resource budgets: <code>task.with_budget</code> caps a call's steps, running time, and allocation, so a dependency that loops forever is stopped. Log records from a dependency name the module that wrote them, and <code>xo audit</code> lists log call sites. Against 17 attack scenarios: 12 blocked, up from 10 of 15. Budgets, narrowed capabilities, and log attribution work on all three backends."
